name: Android build

on:
  push:
    branches: [main, android-google-play]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Build YOSHA VOICE AI for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate YOSHA brand assets
        run: |
          python -m pip install Pillow
          python scripts/generate_brand_assets.py

      - name: Generate Android project
        run: npx cap add android

      - name: Generate native launcher and splash assets
        run: npx capacitor-assets generate --android

      - name: Sync web assets and native plugins
        run: npx cap sync android

      - name: Build debug APK and release App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Sign release App Bundle
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yosha-voice-ai-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            assets/icon-only.png
          if-no-files-found: error
          retention-days: 14
